[package]
name = "atlas-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal client for the Atlas agent session"

[[bin]]
name = "atlas-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
