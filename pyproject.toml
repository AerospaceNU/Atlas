[project]
name = "atlas"
version = "0.9.0"
description = "Local AI agent deployment"
readme = "README.md"
authors = [
    { name = "Richard Tang", email = "tang.ri@northeastern.edu" },
    { name = "Liam Marcovitz", email = "marcovitz.l@northeastern.edu" },
    { name = "Luc Sciammetta", email = "sciammetta.l@northeastern.edu" },
    { name = "Sunny Shen", email = "shen.su@northeastern.edu" },
    { name = "Mason King", email = "king.mas@northeastern.edu" }, 
    { name = "Sabrina Valerjev", email = "sabrinaelena.v@gmail.com"}, 
    { name = "Gabriel Ortiz", email = "ortiz.gabr@northeastern.edu"}
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.104.1",
    "httpx>=0.28.1",
    "lightgbm>=4.6.0",
    "numpy>=2.2.0",
    "pillow>=11.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=13.9.0",
    "scipy>=1.14.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=2.28.0"]

[project.scripts]
atlas = "atlas:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-recording>=0.13.4",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "B",             # flake8-bugbear
    "UP",            # pyupgrade
    "SIM",           # flake8-simplify
    "RUF",           # ruff-specific
    "D",             # pydocstyle (Google)
]
ignore = [
    "E501",  # line length handled by formatter
    # Shape, not presence: thin STAC clients and Pydantic models stay uncommented.
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "dotenv",
    "dotenv.*",
    "google",
    "google.*",
    "lightgbm",
    "lightgbm.*",
    "rich",
    "rich.*",
    "scipy",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "-m",
    "not evals",
]
markers = [
    "evals: opt-in evaluation tests that hit real APIs (deselect with '-m \"not evals\"')",
]
