name = "mask_clouds"
description = "Heuristic cloud mask on a true-color PNG. Bright, low-chroma pixels are cloud (1); everything else is clear (0). Large mosaics are tiled at 512 and stitched. Not a trained model."
runtime = "binary_mask"
rule = "cloud"
weight = ""
sha256 = ""

[input]
kind = "rgb_png"
shape = [0, 0, 3]
dtype = "uint8"
sizes = [256, 512]

[output]
kind = "mask"
classes = ["clear", "cloud"]
