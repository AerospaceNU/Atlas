name = "unet_water"
description = "CPU U-Net open-water mask. Weights are a JSON contract (relative key, optional sha256). Large mosaics are tiled at the weight file's tile edge and stitched to the original size."
runtime = "unet_cpu"
weight = "unet_water/model.json"
sha256 = ""

[input]
kind = "rgb_png"
shape = [0, 0, 3]
dtype = "uint8"
sizes = [32, 256, 512]

[output]
kind = "labels"
classes = ["land", "water"]
